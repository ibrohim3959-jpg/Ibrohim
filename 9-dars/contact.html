            <h1>Missiyaga qo'shiling yoki savol bering</h1>

  <form action="#" method="post"> 
    <p>
      <label for="name">Ismingiz:</label><br>
      <input type="text" id="name" name="name" required>
    </p>
    <p>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <label for="subject">Murojaat turi:</label><br>
      <select id="subject" name="subject">
        <option value="hamkorlik">Hamkorlik</option>
        <option value="sayyohlik">Sayyohlik</option>
        <option value="savol">Savol</option>
      </select>
    </p>
    <p>
      <label for="message">Xabar:</label><br>
      <textarea id="message" name="message" rows="5" cols="30"></textarea>
    </p>
    <button type="submit">Yuborish</button>
  </form>

  <address>
    <p>Markaz manzili: Toshkent shahri, Kosmonavtlar shoh ko'chasi, 42-uy</p>
    <p>Tel: +998 (71) 123-45-67</p>
  </address>

  <h2>Uchirish maydonchasi joylashuvi</h2>

    src="https://maps.google.com/maps?q=Tashkent&t=&z=13&ie=UTF8&iwloc=&output=embed" 
    width="400"
