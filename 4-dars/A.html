<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный 3D Пончик</title>
  <style>
    body {
      background-color: #050505;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: monospace;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }
    body:active {
      cursor: grabbing;
    }
    #donut {
      font-size: 14px;
      line-height: 10px;
      white-space: pre;
      font-weight: bold;
    }
    .hint {
      position: absolute;
      bottom: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <pre id="donut"></pre>
  <div class="hint">Зажмите мышь для вращения | Колесико — зум</div>

  <script>
    const donut = document.getElementById('donut');
    
    // Углы поворота и масштаб
    let A = 0;
    let B = 0;
    let distance = 5;

    // Управление мышью
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      // Меняем углы в зависимости от движения мыши
      B += deltaX * 0.01;
      A += deltaY * 0.01;

      previousMousePosition = { x: e.clientX, y: e.clientY };
      renderFrame();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Приближение/отдаление колесиком
    window.addEventListener('wheel', (e) => {
      distance += e.deltaY * 0.005;
      distance = Math.max(3, Math.min(distance, 10)); // Ограничения зума
      renderFrame();
    });

    // Отрисовка кадра
    function renderFrame() {
      const b = [];
      const z = [];

      const cA = Math.cos(A), sA = Math.sin(A);
      const cB = Math.cos(B), sB = Math.sin(B);

      for (let k = 0; k < 1760; k++) {
        b[k] = k % 80 === 79 ? "\n" : " ";
        z[k] = 0;
      }

      for (let j = 0; j < 6.28; j += 0.07) {
        const ct = Math.cos(j), st = Math.sin(j);

        for (let i = 0; i < 6.28; i += 0.02) {
          const sp = Math.sin(i), cp = Math.cos(i);
          const h = ct + 2;
          const D = 1 / (sp * h * sA + st * cA + distance);
          const t = sp * h * cA - st * sA;

          const x = Math.floor(40 + 30 * D * (cp * h * cB - t * sB));
          const y = Math.floor(12 + 15 * D * (cp * h * sB + t * cB));
          const o = x + 80 * y;

          const N = Math.floor(8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB));

          if (y >= 0 && y < 22 && x >= 0 && x < 80 && D > z[o]) {
            z[o] = D;
            b[o] = ".,-~:;=!*#$@"[N > 0 ? N : 0];
          }
        }
      }

      donut.innerHTML = b.join("");
    }

    // Первоначальный рендер
    renderFrame();
  </script>
</body>
</html>
